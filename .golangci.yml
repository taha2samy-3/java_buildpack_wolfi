version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*archive/zip.ReadCloser).Close
        - (*compress/gzip.Reader).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    gosec:
      excludes:
        - G110
        - G115
        - G204
        - G301
        - G302
        - G304
        - G305
        - G306
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
