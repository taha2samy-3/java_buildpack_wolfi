    id = "paketo-buildpacks/syft"
    version = "2.43.4"
    optional = true
  [[order.group]]
    id = "paketo-buildpacks/maven"
    version = "6.26.0"
  [[order.group]]
    id = "paketo-buildpacks/executable-jar"
    version = "6.17.5"
    optional = true
  [[order.group]]
    id = "paketo-buildpacks/spring-boot"
    version = "5.40.4"
    optional = true
  [[order.group]]
    id = "paketo-buildpacks/apache-tomcat"
    version = "8.12.5"
    optional = true
  [[order.group]]
    id = "paketo-buildpacks/dist-zip"
    version = "5.14.4"
    optional = true
  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.6"
