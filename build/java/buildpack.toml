api = "0.10"

[buildpack]
  id = "taha2samy-3/wolfi-java"
  name = "Wolfi Java Buildpack"
  version = "0.0.0-dev"
  homepage = "https://github.com/taha2samy-3/java_buildpack_wolfi"
  description = "Builds Maven, Gradle, sbt, executable JAR, WAR, dist-zip and Procfile Java applications on Wolfi"
  keywords = ["java", "maven", "gradle", "spring-boot", "fips", "wolfi"]

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/taha2samy-3/java_buildpack_wolfi/blob/main/LICENSE"

[[order]]
  [[order.group]]
    id = "paketo-buildpacks/ca-certificates"
    version = "3.14.4"
    optional = true
  [[order.group]]
    id = "taha2samy-3/wolfi-jvm"
    version = "0.0.0-dev"
