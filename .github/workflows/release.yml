name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  stacks:
    name: Stack images
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      build-image: ${{ steps.meta.outputs.registry }}/wolfi-build
      build-digest: ${{ steps.build.outputs.digest }}
      run-image: ${{ steps.meta.outputs.registry }}/wolfi-run
      run-digest: ${{ steps.run.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          echo "registry=${REGISTRY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stacks/build
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.registry }}/wolfi-build:${{ steps.meta.outputs.version }}
      - id: run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stacks/run
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.registry }}/wolfi-run:${{ steps.meta.outputs.version }}

  buildpacks:
    name: Buildpacks
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      jvm-image: ${{ steps.meta.outputs.registry }}/wolfi-jvm-buildpack
      jvm-digest: ${{ steps.jvm.outputs.digest }}
      java-image: ${{ steps.meta.outputs.registry }}/wolfi-java-buildpack
      java-digest: ${{ steps.java.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          echo "registry=${REGISTRY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: buildpacks/github-actions/setup-pack@324e5c43145b68f60bf74a269f5ba7b2969e03db # v6.2.1
      - uses: buildpacks/github-actions/setup-tools@324e5c43145b68f60bf74a269f5ba7b2969e03db # v6.2.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: jvm
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/wolfi-jvm-buildpack:${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./scripts/package.sh jvm "$VERSION" build/jvm amd64 arm64
          pack buildpack package "$IMAGE" --path build/jvm --target linux/amd64 --target linux/arm64 --publish
          echo "digest=$(crane digest "$IMAGE")" >> "$GITHUB_OUTPUT"
      - id: java
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/wolfi-java-buildpack:${{ steps.meta.outputs.version }}
          JVM: docker://${{ steps.meta.outputs.registry }}/wolfi-jvm-buildpack@${{ steps.jvm.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ./scripts/package.sh render buildpacks/java/buildpack.toml build/java/buildpack.toml "VERSION=$VERSION"
          ./scripts/package.sh render buildpacks/java/package.toml build/java/package.toml "JVM_BUILDPACK=$JVM"
          cp LICENSE build/java/
          pack buildpack package "$IMAGE" --config build/java/package.toml --target linux/amd64 --target linux/arm64 --publish
          echo "digest=$(crane digest "$IMAGE")" >> "$GITHUB_OUTPUT"

  builder:
    name: Builder
    needs: [stacks, buildpacks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.registry }}/wolfi-java-builder
      digest: ${{ steps.builder.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        run: |
          echo "registry=${REGISTRY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: buildpacks/github-actions/setup-pack@324e5c43145b68f60bf74a269f5ba7b2969e03db # v6.2.1
      - uses: buildpacks/github-actions/setup-tools@324e5c43145b68f60bf74a269f5ba7b2969e03db # v6.2.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: builder
        env:
          IMAGE: ${{ steps.meta.outputs.registry }}/wolfi-java-builder:${{ steps.meta.outputs.version }}
          LATEST: ${{ steps.meta.outputs.registry }}/wolfi-java-builder:latest
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_IMAGE: ${{ needs.stacks.outputs.build-image }}@${{ needs.stacks.outputs.build-digest }}
          RUN_IMAGE: ${{ needs.stacks.outputs.run-image }}:${{ steps.meta.outputs.version }}
          JAVA: docker://${{ needs.buildpacks.outputs.java-image }}@${{ needs.buildpacks.outputs.java-digest }}
        run: |
          ./scripts/package.sh render builder/builder.toml build/builder/builder.toml \
            "VERSION=$VERSION" "BUILD_IMAGE=$BUILD_IMAGE" "RUN_IMAGE=$RUN_IMAGE" "JAVA_BUILDPACK=$JAVA"
          for attempt in 1 2 3; do
            pack builder create "$IMAGE" --config build/builder/builder.toml \
              --target linux/amd64 --target linux/arm64 --publish && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          digest="$(crane digest "$IMAGE")"
          crane tag "$IMAGE" latest
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  subjects:
    name: Collect artifacts
    needs: [stacks, buildpacks, builder]
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - id: collect
        env:
          ITEMS: |
            ${{ needs.stacks.outputs.build-image }} ${{ needs.stacks.outputs.build-digest }}
            ${{ needs.stacks.outputs.run-image }} ${{ needs.stacks.outputs.run-digest }}
            ${{ needs.buildpacks.outputs.jvm-image }} ${{ needs.buildpacks.outputs.jvm-digest }}
            ${{ needs.buildpacks.outputs.java-image }} ${{ needs.buildpacks.outputs.java-digest }}
            ${{ needs.builder.outputs.image }} ${{ needs.builder.outputs.digest }}
        run: |
          matrix="$(echo "$ITEMS" | awk 'NF==2 {printf "%s{\"image\":\"%s\",\"digest\":\"%s\"}", (n++ ? "," : ""), $1, $2}')"
          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: subjects
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.subjects.outputs.matrix) }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ matrix.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  sign:
    name: Sign, SBOM and scan
    needs: [subjects, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.subjects.outputs.matrix) }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign
        env:
          REF: ${{ matrix.image }}@${{ matrix.digest }}
        run: cosign sign --yes --recursive "$REF"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}@${{ matrix.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        env:
          REF: ${{ matrix.image }}@${{ matrix.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          sbom: sbom.cdx.json
          fail-build: false
          output-format: table
          output-file: vulnerabilities.txt
      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            head -n 60 vulnerabilities.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: [stacks, buildpacks, builder, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Release notes
        env:
          BUILD: ${{ needs.stacks.outputs.build-image }}@${{ needs.stacks.outputs.build-digest }}
          RUN: ${{ needs.stacks.outputs.run-image }}@${{ needs.stacks.outputs.run-digest }}
          JVM: ${{ needs.buildpacks.outputs.jvm-image }}@${{ needs.buildpacks.outputs.jvm-digest }}
          JAVA: ${{ needs.buildpacks.outputs.java-image }}@${{ needs.buildpacks.outputs.java-digest }}
          BUILDER: ${{ needs.builder.outputs.image }}@${{ needs.builder.outputs.digest }}
        run: |
          go run ./cmd/site notes \
            --version "${GITHUB_REF_NAME#v}" --repository "$GITHUB_REPOSITORY" \
            --image "builder=$BUILDER" --image "jvm-buildpack=$JVM" --image "java-buildpack=$JAVA" \
            --image "build-image=$BUILD" --image "run-image=$RUN" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  docs:
    name: Documentation
    needs: release
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
