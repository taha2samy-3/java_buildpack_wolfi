<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="Java version resolution order"><style>text{font-family:Outfit,Inter,system-ui,sans-serif}</style><circle cx="40" cy="47" r="20" fill="none" stroke="#ff9371" stroke-width="2.5"/><text x="40" y="53" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">1</text><rect x="78" y="20" width="520" height="54" rx="16" fill="#ff9371"/><text x="338.0" y="44.0" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="700">BP_JVM_VERSION</text><text x="338.0" y="63.0" text-anchor="middle" fill="#1a1a1a" fill-opacity=".72" font-size="13">explicit, must be supported</text><path d="M40,69 V95" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="3 4"/><circle cx="40" cy="117" r="20" fill="none" stroke="#ffc06c" stroke-width="2.5"/><text x="40" y="123" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">2</text><rect x="78" y="90" width="520" height="54" rx="16" fill="#ffc06c"/><text x="338.0" y="114.0" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="700">.java-version · .sdkmanrc · .tool-versions</text><text x="338.0" y="133.0" text-anchor="middle" fill="#1a1a1a" fill-opacity=".72" font-size="13">version managers</text><path d="M40,139 V165" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="3 4"/><circle cx="40" cy="187" r="20" fill="none" stroke="#ffedba" stroke-width="2.5"/><text x="40" y="193" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">3</text><rect x="78" y="160" width="520" height="54" rx="16" fill="#ffedba"/><text x="338.0" y="184.0" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="700">pom.xml</text><text x="338.0" y="203.0" text-anchor="middle" fill="#1a1a1a" fill-opacity=".72" font-size="13">release · java.version · target · source</text><path d="M40,209 V235" stroke="#4a4a4a" stroke-width="2" stroke-dasharray="3 4"/><circle cx="40" cy="257" r="20" fill="none" stroke="#95ffec" stroke-width="2.5