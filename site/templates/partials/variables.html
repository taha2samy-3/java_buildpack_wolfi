{{define "variables"}}
<div class="table-wrap">
<table class="vars">
  <thead><tr><th>Variable</th><th>Default</th><th>Description</th></tr></thead>
  <tbody>
  {{$list := .Site.Launch}}{{if eq .Arg "build"}}{{$list = .Site.Build}}{{end}}
  {{range $list}}
    <tr id="{{.Name}}"><td><code>{{.Name}}</code></td><td>{{if .Default}}<code>{{.Default}}</code>{{else}}<span class="muted">unset</span>{{end}}</td><td>{{.Description}}</td></tr>
  {{end}}
  </tbody>
</table>
</div>
{{end}}
