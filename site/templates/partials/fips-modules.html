{{define "fips-modules"}}
<div class="table-wrap">
<table>
  <thead><tr><th>Component</th><th>Version</th><th>SHA-256</th></tr></thead>
  <tbody>
  {{range .Site.FIPS}}<tr><td>{{.Name}}</td><td><code>{{.Version}}</code></td><td><code class="hash">{{.SHA256}}</code></td></tr>{{end}}
  </tbody>
</table>
</div>
{{end}}
