api = "0.10"

[buildpack]
  id = "taha2samy/wolfi-jvm"
  name = "Wolfi JVM Buildpack"
  version = "{{VERSION}}"
  homepage = "https://github.com/taha2samy/java_buildpack_wolfi"
  description = "Eclipse Temurin JDK/JRE for Wolfi stacks with optional FIPS 140-3 mode backed by the Bouncy Castle FIPS module"
  keywords = ["java", "jvm", "jre", "jdk", "fips", "wolfi"]
  sbom-formats = ["application/vnd.cyclonedx+json"]

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/taha2samy/java_buildpack_wolfi/blob/main/LICENSE"

[[targets]]
  os = "linux"
  arch = "amd64"

[[targets]]
  os = "linux"
  arch = "arm64"

[metadata]
  java-versions = ["8", "11", "17", "21", "25"]

  [[metadata.configurations]]
    name = "BP_JVM_VERSION"
    description = "Java major version to install (8, 11, 17, 21, 25). Overrides version hints from the application"
    default = "21"
    build = true

  [[metadata.configurations]]
    name = "BP_JVM_TYPE"
    description = "Runtime placed in the application image: JRE or JDK"
    default = "JRE"
    build = true

  [[metadata.configurations]]
    name = "BP_JVM_FIPS_ENABLED"
    description = "Enable FIPS 140-3 mode using the validated Bouncy Castle FIPS module (CMVP #4943)"
    default = "false"
    build = true

  [[metadata.configurations]]
    name = "BP_DEPENDENCY_MIRROR"
    description = "Base URL of a mirror that replaces the scheme and host of dependency download URIs"
    build = true

  [[metadata.configurations]]
    name = "BPL_JVM_HEAD_ROOM"
    description = "Percentage of total memory kept free for the operating system and native allocations"
    default = "10"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JVM_THREAD_COUNT"
    description = "Expected number of threads used when calculating stack memory"
    default = "250"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JVM_LOADED_CLASS_COUNT"
    description = "Expected number of loaded classes used when calculating metaspace (calculated when unset)"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JVM_TOTAL_MEMORY"
    description = "Total memory available to the JVM, for example 1G. Read from cgroups when unset"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JVM_CA_CERTIFICATES"
    description = "Colon separated list of PEM files or directories added to the JVM truststore at launch"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JAVA_NMT_ENABLED"
    description = "Enable Native Memory Tracking"
    default = "false"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JAVA_NMT_LEVEL"
    description = "Native Memory Tracking level: summary or detail"
    default = "summary"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JMX_ENABLED"
    description = "Enable remote JMX"
    default = "false"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JMX_HOST"
    description = "Interface JMX binds to"
    default = "127.0.0.1"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JMX_PORT"
    description = "JMX and RMI port"
    default = "5000"
    launch = true

  [[metadata.configurations]]
    name = "BPL_DEBUG_ENABLED"
    description = "Enable the JDWP debug agent"
    default = "false"
    launch = true

  [[metadata.configurations]]
    name = "BPL_DEBUG_HOST"
    description = "Interface the debug agent binds to"
    default = "127.0.0.1"
    launch = true

  [[metadata.configurations]]
    name = "BPL_DEBUG_PORT"
    description = "Debug agent port"
    default = "8000"
    launch = true

  [[metadata.configurations]]
    name = "BPL_DEBUG_SUSPEND"
    description = "Suspend the JVM until a debugger attaches"
    default = "false"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JFR_ENABLED"
    description = "Enable Java Flight Recorder"
    default = "false"
    launch = true

  [[metadata.configurations]]
    name = "BPL_JFR_ARGS"
    description = "Arguments passed to -XX:StartFlightRecording"
    default = "dumponexit=true,filename=/tmp/recording.jfr"
    launch = true

  [[metadata.configurations]]
    name = "BPL_HEAP_DUMP_PATH"
    description = "Directory or file used for heap dumps on OutOfMemoryError (disabled when unset)"
    launch = true

